
services:
  mongodb:
    image: mongo:7
    container_name: mina-cafe-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: mina-cafe
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mina-cafe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mina-cafe-backend
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/mina-cafe
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - mina-cafe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001/api}
    container_name: mina-cafe-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - mina-cafe-network

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  mina-cafe-network:
    driver: bridge

